<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main_menu" >
        <h2>Choose game mode</h2>
        <button class="choice">PvE</button>
        <button class="choice">PvP</button>
    </div>

    <div class="container" style="display: none;">
        <header id="head">
            <h1>Tic Tac Toe</h1>
            <div id="status"><h3>Player X turn</h3></div>
        </header>
        <main id="gameboard">
            <button class="card" data-index="0"></button>
            <button class="card" data-index="1"></button>
            <button class="card" data-index="2"></button>
            <button class="card" data-index="3"></button>
            <button class="card" data-index="4"></button>
            <button class="card" data-index="5"></button>
            <button class="card" data-index="6"></button>
            <button class="card" data-index="7"></button>
            <button class="card" data-index="8"></button>
        </main>
        <footer>
            <div class="score">Player X:<span id="score_x">0</span></div>
            <div class="score">Player O:<span id="score_o">0</span></div>
            <button class="btn">Restart Game</button>
            <button class="btn">Main Menu</button>

        </footer>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
